name: Add Industrial Gallery

on:
  push:
    branches: [main]
    paths:
      - 'WhatsApp Image *.jpeg'
      - '.github/workflows/add-industrial-gallery.yml'

permissions:
  contents: write

jobs:
  add-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add gallery section to index
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="industrial-gallery"' in s:
              print('Industrial gallery already exists; nothing to do.')
              raise SystemExit(0)

          css = r'''

/* =====================================================
   INDUSTRIAL GALLERY
===================================================== */

.gallery-section{
    background:#0b1117;
    color:#ffffff;
}

.gallery-heading small{
    color:#f5b400;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
}

.gallery-heading h2{
    color:#ffffff;
}

.gallery-heading p{
    color:#b9c0c6;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.gallery-card{
    background:#111820;
    border:1px solid rgba(255,255,255,.10);
    overflow:hidden;
    transition:.25s;
}

.gallery-card:hover{
    transform:translateY(-5px);
    box-shadow:0 14px 30px rgba(0,0,0,.30);
}

.gallery-card img{
    width:100%;
    height:230px;
    display:block;
    object-fit:cover;
}

@media(max-width:1100px){
    .gallery-grid{grid-template-columns:repeat(2,1fr);}
}

@media(max-width:600px){
    .gallery-grid{grid-template-columns:1fr;}
    .gallery-card img{height:250px;}
}
'''

          gallery = r'''

<!-- =====================================================
     INDUSTRIAL GALLERY
===================================================== -->

<section class="gallery-section" id="industrial-gallery">

    <div class="heading gallery-heading">
        <small>Industrial Gallery</small>
        <h2>Inside our industrial environment.</h2>
        <p>
            A look at industrial work, fabrication and lifting environments.
        </p>
    </div>

    <div class="gallery-grid">

        <div class="gallery-card">
            <img src="WhatsApp%20Image%202026-09-15%20at%206.46.10%20PM.jpeg" alt="Linkwell Enterprises industrial work" loading="lazy">
        </div>

        <div class="gallery-card">
            <img src="WhatsApp%20Image%202026-09-15%20at%206.46.11%20PM.jpeg" alt="Linkwell Enterprises industrial fabrication" loading="lazy">
        </div>

        <div class="gallery-card">
            <img src="WhatsApp%20Image%202026-09-15%20at%206.46.11%20PM%20%281%29.jpeg" alt="Linkwell Enterprises industrial facility" loading="lazy">
        </div>

        <div class="gallery-card">
            <img src="WhatsApp%20Image%202026-09-15%20at%206.46.12%20PM.jpeg" alt="Linkwell Enterprises crane manufacturing environment" loading="lazy">
        </div>

        <div class="gallery-card">
            <img src="WhatsApp%20Image%202026-09-15%20at%206.46.12%20PM%20%281%29.jpeg" alt="Linkwell Enterprises engineering work" loading="lazy">
        </div>

        <div class="gallery-card">
            <img src="WhatsApp%20Image%202026-09-15%20at%206.46.12%20PM%20%282%29.jpeg" alt="Linkwell Enterprises industrial project" loading="lazy">
        </div>

        <div class="gallery-card">
            <img src="WhatsApp%20Image%202026-09-15%20at%206.46.13%20PM.jpeg" alt="Linkwell Enterprises heavy fabrication" loading="lazy">
        </div>

    </div>

</section>
'''

          if '</style>' not in s:
              raise SystemExit('Could not find closing style tag.')
          s = s.replace('</style>', css + '\n</style>', 1)

          marker = '<!-- =====================================================\n     CTA\n===================================================== -->'
          if marker not in s:
              raise SystemExit('Could not find CTA marker.')
          s = s.replace(marker, gallery + '\n\n' + marker, 1)

          p.write_text(s, encoding='utf-8')
          print('Industrial gallery added.')

      - name: Commit gallery changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No gallery changes to commit."
          else
            git commit -m "Add industrial gallery section"
            git push
          fi
